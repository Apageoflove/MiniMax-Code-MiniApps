<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCP OAuth 令牌台</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-header__main">
        <h1>MCP OAuth 令牌台</h1>
        <p class="app-header__desc">
          为受 OAuth 保护的 MCP 服务器完成授权码 + PKCE 登录，自动续期，并把令牌写回本地
          <code>mcp.json</code> 与凭据文件。令牌本身只保存在本机，不会在页面上显示。
        </p>
      </div>
      <div class="app-header__actions">
        <button id="theme-toggle" class="btn btn--icon" type="button" aria-label="切换亮色 / 暗色主题">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5" />
            <path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4" stroke-linecap="round" />
          </svg>
        </button>
        <button id="refresh-all" class="btn btn--secondary" type="button">刷新即将过期</button>
        <button id="add-server" class="btn btn--primary" type="button">添加服务器</button>
      </div>
    </header>

    <main>
      <section class="kpis" aria-label="令牌总览">
        <div class="kpi">
          <span class="kpi__label">MCP 服务器</span>
          <span class="kpi__value" id="kpi-total">—</span>
        </div>
        <div class="kpi">
          <span class="kpi__label">已配置令牌</span>
          <span class="kpi__value" id="kpi-authorized">—</span>
        </div>
        <div class="kpi">
          <span class="kpi__label">可自动续期</span>
          <span class="kpi__value" id="kpi-refreshable">—</span>
        </div>
        <div class="kpi">
          <span class="kpi__label">即将过期</span>
          <span class="kpi__value" id="kpi-expiring">—</span>
        </div>
      </section>

      <section class="panel" aria-labelledby="settings-heading">
        <div class="panel__head">
          <h2 id="settings-heading">设置</h2>
          <p class="panel__hint" id="config-path-hint">—</p>
        </div>
        <div class="settings">
          <label class="switch">
            <input type="checkbox" id="toggle-auto-refresh" />
            <span>到期前自动续期</span>
          </label>
          <p class="field__hint">默认关闭。关闭时只有手动点「刷新令牌」才会写配置，Mini App 停止期间不会有任何写入。</p>
          <label class="switch">
            <input type="checkbox" id="toggle-private-network" />
            <span>允许访问内网地址</span>
          </label>
          <p class="field__hint">默认拒绝私有网段、链路本地与实例元数据地址。局域网里的 MCP 服务器需要打开它。</p>
        </div>
      </section>

      <section class="panel" aria-labelledby="servers-heading">
        <div class="panel__head">
          <h2 id="servers-heading">服务器</h2>
          <p class="panel__hint" id="panel-hint">正在读取本地 MCP 配置…</p>
        </div>
        <div id="servers" class="servers" role="region" aria-label="MCP 服务器列表" aria-live="polite" aria-busy="true"></div>
      </section>
    </main>

    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root" role="status" aria-live="polite"></div>

    <script src="/assets/app.js" type="module"></script>
  </body>
</html>
